packages:
  - packages/*
  - apps/cli
# esbuild needs its install script to place the platform binary. Nothing else
# is allowed to run code at install time.
allowBuilds:
  esbuild: true
  # A native accelerator the Vercel SDK pulls in transitively. The JS
  # fallback is fine; a test suite is not worth a compiler at install time.
  msgpackr-extract: false
  msw: false

overrides:
  vite: ^7.2.0
  # Reached only through the express peer dependency our tests install, so no
  # published package carries it, but the release gate wants a clean audit.
  qs: '>=6.16.0'
