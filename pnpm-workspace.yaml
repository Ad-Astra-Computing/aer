packages:
  - packages/*
  - apps/cli
# esbuild needs its install script to place the platform binary. Nothing else
# is allowed to run code at install time.
allowBuilds:
  esbuild: true
  # A native accelerator the Vercel SDK pulls in transitively. The JS
  # fallback is fine; a test suite is not worth a compiler at install time.
  msgpackr-extract: false
  msw: false

overrides:
  vite: ^7.2.0
  # Reached only through the express peer dependency our tests install, so no
  # published package carries it, but the release gate wants a clean audit.
  qs: '>=6.16.0'
  # express ^5 pins proxy-addr ^2.0.7 (allows the vulnerable 2.0.7); changesets'
  # launch-editor pins shell-quote ^1.8.4 (allows pre-1.11.0). Both advisories
  # are critical; neither upstream has re-pinned yet.
  proxy-addr: ^2.0.8
  shell-quote: ^1.11.0
  # @modelcontextprotocol/sdk bundles @hono/node-server pinned to an old hono
  # for its own example HTTP transport; not reachable from our code either way.
  hono: ^4.13.13
  # Reached through postcss's own dependency range; upstream hasn't re-pinned.
  source-map-js: ^1.2.2
