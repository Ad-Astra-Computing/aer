name: Release

on:
  push:
    branches: [main]
  # Publishing should be possible as a deliberate act, not only as a side
  # effect of pushing something unrelated to main.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A vendored copy that drifts from its source means a bodies-off fix
      # landed in one published package and not the other.
      - run: node scripts/check-vendored.mjs

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm release
          commit-message: "release: version packages"
          pr-title: "release: version packages"
          # Tag every published version. Without a tag there is no way to get
          # from a version on npm back to the commit that produced it.
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
