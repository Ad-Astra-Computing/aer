name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every package declares engines.node >=20, but Node 20 is past end of
        # life. Test the oldest runtime we stand behind and the one CI ships on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

  # The Python SDK ships from this repository and had no CI coverage at all, so
  # its suite only ever ran on a developer's machine.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip pytest build

      - run: python -m pytest -q
        working-directory: packages/sdk-py
        env:
          PYTHONPATH: src

      - name: The wheel must build and import
        run: |
          python -m build --wheel --outdir /tmp/wheel packages/sdk-py
          python -m pip install /tmp/wheel/*.whl
          python -c "from aer_sdk import AerClient, create_session; print('import ok')"

  # Publishing ships tarballs, not the repository, so check what npm would
  # actually send: docs present, nothing stray, no install-time scripts.
  package-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: node .github/scripts/check-package-contents.mjs

  # The flake is a supported way to consume this repo, so it has to keep
  # working. `nix flake check` builds, typechecks and tests every workspace
  # member offline in the sandbox, and builds the Python SDK.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: The lock file must be current
        run: |
          nix flake metadata --json > /dev/null
          git diff --exit-code flake.lock

      # --all-systems evaluates every system we claim to support, not just the
      # runner architecture. That is what catches an eval error on a platform
      # CI cannot build, which is exactly how the darwin breakage got in.
      - run: nix flake check --all-systems --print-build-logs

      # Every app output, not just the CLI. `nix flake check` only evaluates
      # these; it never runs them, so a wrapper that builds but cannot resolve
      # its imports at runtime would pass the gate and fail the first user.
      - name: Every binary must run from the flake
        run: |
          for app in aer aer-hooks aer-hook aer-mcp-recorder; do
            echo "::group::nix run .#$app -- --help"
            # Both streams together. Discarding stdout hides a warning the
            # reader is shown, and the exit code alone says nothing about it.
            out="$(nix run ".#$app" -- --help 2>&1)"
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -Eiq 'warning|deprecated'; then
              echo "::error::$app --help warns the reader"
              exit 1
            fi
            echo "::endgroup::"
          done

      # The wiring a coding harness gets told to use, end to end: install into
      # a scratch directory, confirm it reports itself wired, then remove it.
      - name: Harness wiring must work from the installed tools
        run: |
          nix profile add .#tools
          workdir="$(mktemp -d)"
          aer-hooks install claude-code --dir "$workdir"
          aer-hooks status --dir "$workdir" | grep -q 'wired: '
          command -v aer-hook > /dev/null
          aer-hooks uninstall claude-code --dir "$workdir"

  # A command printed in the README is an artifact we publish. This runs each
  # one as printed, from a scratch directory and a scratch HOME, so a command
  # that only works inside this checkout fails here rather than for a reader.
  readme-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - run: node scripts/check-readme-commands.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: node .github/scripts/scan-secrets.mjs

  # Published packages declare no runtime dependencies, so a production-only
  # audit would gate an empty set. The toolchain is the real surface: it runs
  # in the release job while that job holds publish credentials.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No critical advisory anywhere, including the release toolchain
        run: pnpm audit --audit-level=critical

      - name: No high advisory in what we publish
        run: pnpm audit --prod --audit-level=high

      - name: Everything else, reported but not blocking
        if: always()
        run: pnpm audit || true

  # A change to a published package with no changeset never ships: the version
  # pull request will not carry it, so the fix sits on main looking released.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: node .github/scripts/check-changeset.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
